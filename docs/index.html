<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a17">
  <meta name="description" content="Crumbs language documentation: syntax, types, standard library, compiler, and tooling.">
  <title>Crumbs — Documentation</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("crumbs-theme") || "dark";
    } catch {}
  </script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap");

    :root {
      color-scheme: dark;
      --page: #191a17;
      --sidebar: #1e1f1b;
      --surface: #22231f;
      --surface-raised: #292a25;
      --code: #131410;
      --ink: #f0f0e9;
      --muted: #b0b0a5;
      --subtle: #85867c;
      --line: #393a33;
      --line-strong: #4a4b41;
      --accent: #efcf4b;
      --accent-soft: rgba(239, 207, 75, .12);
      --accent-ink: #202019;
      --shadow: 0 18px 52px rgba(0, 0, 0, .32);
      --header-height: 64px;
      --sidebar-width: 264px;
      --content-width: 1080px;
      --ease-out-cubic: cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f7f7f3;
      --sidebar: #f0f0eb;
      --surface: #fff;
      --surface-raised: #f0f0e9;
      --code: #20211d;
      --ink: #272820;
      --muted: #606157;
      --subtle: #85867b;
      --line: #deded5;
      --line-strong: #c9c9bd;
      --accent: #d7b52c;
      --accent-soft: rgba(215, 181, 44, .14);
      --accent-ink: #202019;
      --shadow: 0 18px 52px rgba(30, 31, 24, .13);
    }

    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.7 "DM Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.menu-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { color: inherit; }
    ::selection { background: var(--accent-soft); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Topbar */
    .topbar {
      position: sticky;
      inset: 0 0 auto;
      z-index: 60;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 28px;
      background: color-mix(in srgb, var(--sidebar) 94%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      transition: border-color .3s ease;
    }
    .topbar-left, .topbar-right, .brand, .top-link {
      display: flex;
      align-items: center;
    }
    .topbar-left { gap: 14px; min-width: 0; }
    .brand { gap: 10px; min-width: 0; font-size: 18px; font-weight: 800; letter-spacing: -.055em; cursor: pointer; }
    .brand img {
      display: block; width: 31px; height: 31px; object-fit: contain;
      transition: transform .3s ease;
    }
    .brand:hover img { transform: rotate(-8deg) scale(1.08); }
    .brand-divider { width: 1px; height: 18px; background: var(--line-strong); }
    .brand-context { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0; }
    .topbar-right { gap: 20px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .top-link { transition: color .2s ease; cursor: pointer; }
    .top-link:hover { color: var(--ink); }
    .repo-link { display: inline-flex; align-items: center; gap: 7px; transition: color .2s ease; }
    .repo-link:hover { color: var(--accent); }
    .repo-link svg { width: 16px; height: 16px; fill: currentColor; }
    .icon-button {
      display: grid;
      place-items: center;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      transition: all .2s ease;
    }
    .icon-button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .icon-button svg {
      width: 17px; height: 17px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .menu-toggle { display: none; }

    /* Layout & Sidebar */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: calc(100vh - var(--header-height));
    }
    .sidebar {
      position: sticky;
      top: var(--header-height);
      align-self: start;
      height: calc(100vh - var(--header-height));
      height: calc(100dvh - var(--header-height));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }
    .sidebar-top { flex: 0 0 auto; padding: 18px 17px 4px 19px; }
    .sidebar-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 6px 12px 36px 19px;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 8px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid var(--sidebar); }
    .sidebar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 9px 10px;
      color: var(--subtle);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .sidebar-heading span:last-child {
      color: var(--subtle);
      font: 10px "DM Mono", monospace;
      letter-spacing: 0;
    }
    .search-wrap { position: relative; margin: 0 0 12px; }
    .search-wrap svg {
      position: absolute; top: 12px; left: 11px; pointer-events: none;
      width: 15px; height: 15px; fill: none;
      stroke: var(--subtle); stroke-width: 1.8;
      transition: stroke .2s ease;
    }
    #doc-search {
      width: 100%;
      height: 39px;
      padding: 0 10px 0 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: 0;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      transition: all .2s ease;
    }
    #doc-search::placeholder { color: var(--subtle); }
    #doc-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #doc-search:focus + svg { stroke: var(--accent); }

    .nav-overview-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: all .2s ease;
    }
    .nav-overview-btn:hover, .nav-overview-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .nav-overview-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    .nav-section { margin: 0 0 11px; }
    .nav-section-head { display: flex; align-items: center; gap: 3px; }
    .nav-section-link {
      flex: 1; min-width: 0; display: block;
      padding: 7px 9px; border-radius: 5px;
      font-size: 12px; font-weight: 750; letter-spacing: -.01em;
      transition: background .15s ease, color .15s ease;
    }
    .nav-section-link:hover, .nav-section.open > .nav-section-head .nav-section-link {
      background: var(--surface-raised);
    }
    .nav-section-count {
      color: var(--subtle);
      font: 10px "DM Mono", monospace;
      margin-left: auto;
      padding-left: 8px;
    }
    .nav-collapse {
      display: grid; place-items: center; flex: 0 0 26px;
      width: 26px; height: 28px; border: 0; border-radius: 4px;
      background: transparent; color: var(--subtle); cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .nav-collapse:hover { background: var(--surface-raised); color: var(--ink); }
    .nav-collapse svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .2s var(--ease-out-cubic); }
    .nav-section:not(.open) .nav-collapse svg { transform: rotate(-90deg); }
    .nav-section-children {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .25s var(--ease-out-cubic), opacity .25s ease;
      opacity: 1;
    }
    .nav-section-children-inner { overflow: hidden; padding: 3px 0 2px 10px; }
    .nav-section:not(.open) .nav-section-children {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }
    .nav-subsection {
      display: block; padding: 5px 8px; margin: 3px 0 3px 6px; border-radius: 4px;
      color: var(--subtle); font-size: 11px; font-weight: 600; line-height: 1.45;
      transition: all .15s ease; cursor: pointer; border-left: 2px solid transparent;
    }
    .nav-subsection:hover { color: var(--ink); background: var(--surface-raised); transform: translateX(2px); }
    .nav-subsection.active { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 700; }
    .nav-empty { display: none; margin: 8px; color: var(--muted); font-size: 12px; }

    /* Main Area & Dynamic Pages */
    .main-area { min-width: 0; }
    main { width: min(100%, var(--content-width)); margin: 0 auto; padding: 42px 48px 88px; }
    .breadcrumbs {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 25px; color: var(--subtle);
      font-size: 11px; font-weight: 650;
    }
    .breadcrumbs a { transition: color .15s ease; cursor: pointer; }
    .breadcrumbs a:hover { color: var(--ink); }
    .breadcrumbs .current { color: var(--accent); }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 12px var(--accent-soft)); }
    }

    .page-view {
      animation: fadeInUp .35s var(--ease-out-cubic) forwards;
    }

    /* Hero / Overview */
    .hero {
      position: relative;
      padding: 0 0 32px;
      margin: 0 0 30px;
      border-bottom: 1px solid var(--line);
    }
    .hero-header {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .hero-logo {
      width: 30vw;
      height: auto;
      object-fit: contain;
      flex-shrink: 0;
      animation: pulseLogo 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.25));
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 0 0 10px; color: var(--accent);
      font-size: 10px; font-weight: 800;
      letter-spacing: .15em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 17px; height: 2px; background: var(--accent); }
    h1 {
      margin: 0; font-size: clamp(43px, 5.2vw, 62px);
      line-height: 1.02; letter-spacing: -.075em; font-weight: 800;
    }
    .hero-tagline {
      margin: 12px 0 0; color: var(--muted);
      font-size: clamp(16px, 2vw, 19px); font-weight: 600;
      letter-spacing: -.035em;
    }
    .hero-description {
      max-width: 680px; margin: 13px 0 0;
      color: var(--muted); font-size: 14px; line-height: 1.85;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 39px; padding: 8px 16px;
      border: 1px solid var(--accent); border-radius: 5px;
      background: var(--accent); color: var(--accent-ink);
      font-size: 11px; font-weight: 800; transition: all .2s ease;
      cursor: pointer;
    }
    .button:hover { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-soft); }
    .button.secondary {
      border-color: var(--line-strong);
      background: transparent; color: var(--ink);
    }
    .button.secondary:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }

    /* Quickstart */
    .quickstart {
      margin: 0 0 45px;
      padding: 20px 21px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      transition: border-color .2s ease;
    }
    .quickstart:hover { border-color: var(--line-strong); }
    .quickstart-heading {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 13px;
    }
    .quickstart-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.035em; }
    .quickstart-heading span { color: var(--subtle); font-size: 10px; font-weight: 650; }
    .quickstart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .quickstart-item {
      min-width: 0; padding: 10px 11px;
      background: var(--surface-raised); border: 1px solid var(--line); border-radius: 5px;
      transition: transform .2s ease, border-color .2s ease;
    }
    .quickstart-item:hover { transform: translateY(-2px); border-color: var(--line-strong); }
    .quickstart-item code {
      display: block; overflow-x: auto; white-space: nowrap;
      color: var(--ink); font: 11px/1.6 "DM Mono", monospace;
    }
    .quickstart-item p { margin: 5px 0 0; color: var(--subtle); font-size: 10px; line-height: 1.5; }

    /* Subsection Single Page View */
    .subsection-page-header {
      padding-bottom: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }
    .subsection-page-category {
      font-size: 11px; font-weight: 750; color: var(--accent);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px;
    }
    .subsection-page-title {
      font-size: 36px; font-weight: 800; letter-spacing: -.05em; margin: 0;
    }

    .feature-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      transition: border-color .2s ease, transform .2s ease;
    }
    .feature-card:hover { border-color: var(--line-strong); }

    .feature-copy { min-width: 0; }
    .feature-copy h3 { margin: 0 0 8px; font-size: 18px; font-weight: 750; letter-spacing: -.02em; line-height: 1.35; }
    .feature-copy p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
    .feature-note {
      margin-top: 14px; padding: 10px 14px;
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
      background: var(--accent-soft); color: var(--ink);
      font-size: 12px; line-height: 1.7;
    }
    .feature-example { margin-top: 18px; min-width: 0; }
    
    /* Code Viewer */
    .code-wrap {
      min-width: 0; overflow: hidden; margin: 0;
      border: 1px solid #36372f; border-radius: 6px;
      background: var(--code); color: #eeeee6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .code-top {
      height: 34px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 11px;
      border-bottom: 1px solid #34352e; background: #191a16;
      color: #96988d; font: 10px "DM Mono", monospace;
    }
    .code-top-left { display: flex; align-items: center; gap: 8px; }
    .code-dots { display: flex; align-items: center; gap: 4px; }
    .code-dots i { width: 6px; height: 6px; border-radius: 50%; background: #55574d; }
    .copy-button {
      min-height: 26px; padding: 3px 8px;
      border: 1px solid #45473c; border-radius: 4px;
      background: transparent; color: #c4c5b9;
      font: 10px "DM Sans", sans-serif; cursor: pointer;
      transition: all .15s ease;
    }
    .copy-button:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,0.04); }
    pre {
      max-width: 100%; margin: 0; padding: 14px 16px;
      overflow: auto; color: #e9e9e1;
      font: 12px/1.75 "DM Mono", ui-monospace, monospace;
      tab-size: 4; -webkit-overflow-scrolling: touch;
    }
    code { font-family: "DM Mono", ui-monospace, monospace; }
    .inline-code {
      padding: 2px 5px; border-radius: 4px;
      background: var(--accent-soft); color: var(--accent);
      font-size: .91em; white-space: normal; overflow-wrap: anywhere;
    }

    /* Syntax Highlighting */
    .tok-keyword { color: #e0b0eb; font-weight: 500; }
    .tok-type { color: #8bcbd8; }
    .tok-string { color: #bad58b; }
    .tok-number { color: #edb47c; }
    .tok-comment { color: #85897c; font-style: italic; }
    .tok-function { color: #eed276; }
    .tok-operator { color: #d8a879; }
    .tok-variable { color: #d9b2e9; }
    .tok-flag { color: #8bcbd8; }
    .tok-command { color: #eed276; font-weight: 600; }

    .feature-image {
      display: block; max-width: 100%; height: auto;
      margin-top: 13px; border: 1px solid var(--line);
      border-radius: 5px;
    }
    .feature-link { display: inline-flex; margin-top: 13px; color: var(--accent); font-size: 12px; font-weight: 750; transition: transform .15s ease; }
    .feature-link:hover { text-decoration: underline; transform: translateX(2px); }
    
    /* Next/Previous Sub-Section Footer Link */
    .subsection-nav-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .next-subsection-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      text-align: right;
      transition: all .2s ease;
    }
    .next-subsection-btn:hover {
      border-color: var(--accent);
      background: var(--surface-raised);
      transform: translateX(4px);
    }
    .next-btn-text span { display: block; }
    .next-btn-text .next-label { font-size: 10px; font-weight: 750; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; }
    .next-btn-text .next-title { font-size: 14px; font-weight: 800; color: var(--ink); }
    .next-subsection-btn svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2.5; }

    .no-results {
      display: none; padding: 30px 18px; margin: 20px 0;
      border: 1px dashed var(--line-strong); border-radius: 6px;
      color: var(--muted); text-align: center; font-size: 12px;
    }
    .footer {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 12px; padding-top: 24px; margin-top: 40px; border-top: 1px solid var(--line);
      color: var(--subtle); font-size: 11px;
    }
    .footer a { color: var(--muted); transition: color .15s ease; }
    .footer a:hover { color: var(--accent); }

    /* Benchmarks on the overview */
    .bench { margin: 0 0 40px; }
    .bench-lead { margin: 6px 0 14px; color: var(--muted); font-size: 13.5px; max-width: 760px; }
    .bench-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .bench-table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 12.5px; }
    .bench-table th, .bench-table td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
    .bench-table thead th { border-top: 0; color: var(--subtle); font-size: 11px; font-weight: 700; vertical-align: bottom; white-space: normal; }
    .bench-table th:first-child, .bench-table td:first-child { text-align: left; color: var(--ink); font-weight: 600; white-space: normal; min-width: 190px; }
    .bench-table td.me, .bench-table th.me { background: var(--accent-soft); }
    .bench-table td { font-family: "DM Mono", monospace; }
    .bench-cell { position: relative; display: inline-block; min-width: 56px; }
    .bench-cell i { position: absolute; left: 0; bottom: -3px; height: 2px; border-radius: 1px; background: var(--line-strong); }
    .bench-table td.me .bench-cell i { background: var(--accent); }
    .bench-table td.best { color: var(--accent); font-weight: 600; }
    .bench-table td.bad { color: #e8a07a; }
    .bench-note { margin: 12px 0 0; color: var(--muted); font-size: 12.5px; max-width: 820px; line-height: 1.75; }
    .bench-gc { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 9px; margin: 16px 0 0; }
    .bench-gc div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .bench-gc b { display: block; font: 600 20px "DM Mono", monospace; color: var(--accent); }
    .bench-gc span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.5; }

    /* Mode tabs (Guide / Standard library) */
    .mode-tabs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .mode-tab {
      padding: 5px 13px; border: 0; border-radius: 5px; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .mode-tab:hover { color: var(--ink); }
    .mode-tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
    .sidebar .mode-tabs { display: none; width: 100%; margin: 0 0 12px; }
    .sidebar .mode-tab { flex: 1; }
    .topbar-mid { display: flex; align-items: center; }

    /* Navigation: pages (level 2) and anchors inside them (level 3) */
    .nav-group-label {
      margin: 14px 9px 4px; color: var(--subtle); font-size: 10px; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .nav-group-label:first-child { margin-top: 2px; }
    .nav-page { margin: 0; }
    .nav-page-link {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px; margin: 1px 0; border-radius: 5px;

    .nav-page-link:hover { color: var(--ink); background: var(--surface-raised); }

    .nav-anchors { margin: 1px 0 6px 13px; padding-left: 8px; border-left: 1px solid var(--line); }
    .nav-anchor {

    .nav-anchor:hover { color: var(--ink); background: var(--surface-raised); }
    .nav-anchor .mono { font-family: "DM Mono", monospace; font-size: 10.5px; overflow-wrap: anywhere; }
    .nav-anchor .kind { flex: none; width: 12px; color: var(--accent); font: 10px "DM Mono", monospace; opacity: .85; }
    .nav-more { margin: 2px 0 2px 7px; padding: 3px 7px; border: 0; background: none; color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer; }
    .nav-page-hits { margin-top: -2px; }
    mark { background: var(--accent-soft); color: var(--accent); border-radius: 2px; padding: 0 1px; }
    .nav-cross {
      display: block; width: 100%; margin: 14px 0 0; padding: 9px 11px; border: 1px dashed var(--line-strong);

    }
    .nav-cross:hover { border-color: var(--accent); color: var(--accent); }
    .nav-empty { padding: 4px 9px; }
    .nav-clear { position: absolute; top: 7px; right: 7px; display: none; width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; color: var(--subtle); cursor: pointer; font-size: 16px; line-height: 1; }
    .nav-clear:hover { color: var(--ink); background: var(--surface-raised); }
    .search-wrap.has-text .nav-clear { display: block; }
    #doc-search::-webkit-search-cancel-button { display: none; }
    #doc-search { padding-right: 32px; }

    .flash { animation: flash 1.6s ease-out; }
    @keyframes flash { 0% { background: var(--accent-soft); box-shadow: 0 0 0 6px var(--accent-soft); } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }
    [id^="a-"], .feature-card[id] { scroll-margin-top: calc(var(--header-height) + 18px); }

    /* Standard library reference */
    .api-lead { margin: 14px 0 0; max-width: 760px; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .api-import {
      display: inline-flex; align-items: center; gap: 10px; margin: 16px 0 0; padding: 7px 8px 7px 13px;
      border: 1px solid var(--line); border-radius: 7px; background: var(--code); color: #e8e8dd;
      font: 12.5px "DM Mono", monospace; max-width: 100%;
    }
    .api-import .tok-keyword { color: #e0b0eb; }
    .api-import button { border: 1px solid var(--line-strong); border-radius: 4px; background: transparent; color: #b0b0a5; font-size: 11px; padding: 2px 8px; cursor: pointer; }
    .api-import button:hover { color: var(--accent); border-color: var(--accent); }
    .api-prose p { margin: 12px 0 0; max-width: 760px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .api-toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 0; }
    .api-toc a {
      padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
      color: var(--muted); font: 11.5px "DM Mono", monospace; cursor: pointer; transition: all .15s ease;
    }
    .api-toc a:hover { border-color: var(--accent); color: var(--accent); }
    .api-h2 { margin: 44px 0 14px; padding-bottom: 9px; border-bottom: 1px solid var(--line); font-size: 19px; letter-spacing: -.03em; font-weight: 800; display: flex; align-items: baseline; gap: 9px; }
    .api-h2 small { color: var(--subtle); font: 11px "DM Mono", monospace; letter-spacing: 0; font-weight: 400; }
    .api-fn {
      margin: 0 0 14px; padding: 16px 18px 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
      min-width: 0;
    }
    .api-fn-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 9px; }
    .api-fn-name { margin: 0; font: 600 15px "DM Mono", monospace; letter-spacing: -.01em; overflow-wrap: anywhere; }
    .api-fn-name .owner { color: var(--subtle); font-weight: 400; }
    .badge { padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
    .badge.fail { color: #e8a07a; border-color: rgba(232,160,122,.5); }
    .badge.mut { color: var(--accent); border-color: rgba(239,207,75,.45); }
    .api-sig {
      margin: 0 0 11px; padding: 10px 13px; border-radius: 6px; background: var(--code); color: #e8e8dd;
      font: 12.5px/1.7 "DM Mono", monospace; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
    }
    .api-desc { margin: 0 0 4px; color: var(--ink); font-size: 14px; line-height: 1.7; }
    .api-table { width: 100%; margin: 12px 0 0; border-collapse: collapse; font-size: 13px; }
    .api-table caption { text-align: left; margin-bottom: 4px; color: var(--subtle); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .api-table th, .api-table td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
    .api-table th { color: var(--subtle); font-weight: 600; }
    .api-table td:first-child { font: 600 12.5px "DM Mono", monospace; white-space: nowrap; }
    .api-table td.ty { font: 12px "DM Mono", monospace; color: #8bcbd8; overflow-wrap: anywhere; }
    .api-table td.d { color: var(--muted); }
    .api-returns { margin: 12px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
    .api-returns b { margin-right: 8px; color: var(--subtle); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

    .std-card {
      display: block; padding: 13px 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
      cursor: pointer; transition: border-color .15s ease, transform .15s ease;

    .std-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    .std-card small { display: block; margin-top: 8px; color: var(--subtle); font: 10.5px "DM Mono", monospace; }
    .std-group-title { margin: 32px 0 0; color: var(--subtle); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .guide-ref-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 24px; padding: 13px 16px; border: 1px solid var(--accent); border-radius: 9px; background: var(--accent-soft); color: var(--ink); font-size: 13.5px; cursor: pointer; }

    @media (max-width: 600px) {

    @media (max-width: 1080px) {
      :root { --sidebar-width: 242px; }

      .sidebar.open { transform: translateX(0); visibility: visible; }
      .sidebar-backdrop {
        position: fixed; z-index: 80;
        inset: var(--header-height) 0 0;
        display: block; border: 0;
        background: rgba(0, 0, 0, .48);
        opacity: 0; visibility: hidden;
        transition: opacity .25s ease, visibility .25s ease;
      }
      .sidebar-backdrop.open { opacity: 1; visibility: visible; }
      main { width: min(100%, 780px); padding: 31px 26px 62px; }
    }
    @media (max-width: 600px) {
      .topbar { padding: 0 13px; }
      .brand { gap: 8px; font-size: 17px; }

      .feature-card { padding: 18px; }
      .code-top { height: 33px; }

    }
    @media (max-width: 370px) {
      .topbar { padding-inline: 10px; }
      .brand { font-size: 16px; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .hero-logo { animation: none; }
      .page-view { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">

        Repository
      </a>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">

  </header>

  <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close documentation menu"></button>

  <div class="layout" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
      <div class="sidebar-top">
        <div class="mode-tabs" role="tablist" aria-label="Documentation section">
          <button class="mode-tab" role="tab" data-mode="guide" type="button">Guide</button>
          <button class="mode-tab" role="tab" data-mode="std" type="button">Standard library</button>
        </div>
        <div class="search-wrap" id="search-wrap">
          <input id="doc-search" type="search" placeholder="Search..." aria-label="Search the documentation" autocomplete="off" spellcheck="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
          <button class="nav-clear" id="search-clear" type="button" aria-label="Clear search">×</button>
        </div>
        <p class="sidebar-heading"><span id="nav-title">Contents</span><span id="topic-count"></span></p>
      </div>

        <div id="nav-cross"></div>

    </aside>

    <div class="main-area">
      <main id="app-content">
        <!-- Rendered dynamically as SPA pages -->
      </main>
    </div>
  </div>

  <script>
    const IS_MOBILE = window.matchMedia("(max-width: 768px)").matches;
    const DATA_URL  = "features.json";
    const KEYWORDS  = new Set([
      "import", "pub", "struct", "enum", "error", "const", "fn", "let", "mut",
      "if", "else", "for", "in", "match", "return", "break", "continue", "try",
      "catch", "throw", "drop", "extern", "include", "link", "define", "export",
      "as", "null", "true", "false", "impl", "region", "trait"
    ]);
    const TYPES = new Set([
      "i8", "i16", "i32", "i64", "u8", "u16", "u32", "u64",
      "f32", "f64", "bool", "str", "String", "void", "List"
    ]);
    
    const STD_URL = "stdlib.json";
    let DOC_DATA = null;
    let STD_DATA = null;
    let BENCH_DATA = null;
    let SUBSECTION_MAP = new Map();
    let SUBSECTION_ORDER = [];
    let CURRENT_PAGE_ID = "overview";
    let MODE = "guide";
    let NAV = { guide: [], std: [] };
    let STD_MODULES = new Map();
    let CURRENT_ANCHOR = "";

    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
    const make = (tag, className, text) => {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    };
    const inlineText = value => escapeHTML(value || "").replace(
      /`([^`]+)`/g, '<code class="inline-code">$1</code>'
    );

    function highlightCrumbs(source) {
      const tokenPattern = /(\/\/[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b[A-Za-z_][A-Za-z0-9_]*\b|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|->|=>|\.\.=|\.\.|\+%=|-%=|\*%=|==|!=|<=|>=|\+%|-%|\*%|&&|\|\||[^\s])/g;
      let output = "";
      let last = 0;
      for (const match of source.matchAll(tokenPattern)) {
        const token = match[0];
        const index = match.index;
        output += escapeHTML(source.slice(last, index));
        let kind = "";
        if (token.startsWith("//")) kind = "comment";
        else if (/^["'`]/.test(token)) kind = "string";
        else if (KEYWORDS.has(token)) kind = "keyword";
        else if (TYPES.has(token)) kind = "type";
        else if (/^\d/.test(token)) kind = "number";
        else if (/^[A-Za-z_]/.test(token) && /^\s*\(/.test(source.slice(index + token.length))) kind = "function";
        else if (/^(->|=>|\.\.|\.\.=|\+%=|-%=|\*%=|==|!=|<=|>=|\+%|-%|\*%|&&|\|\||[+*/%=<>!&|^~-])$/.test(token)) kind = "operator";
        output += kind ? `<span class="tok-${kind}">${escapeHTML(token)}</span>` : escapeHTML(token);
        last = index + token.length;
      }
      return output + escapeHTML(source.slice(last));
    }

    function highlightShell(source) {
      const shellKeywords = new Set([
        "crumbs", "cookie", "run", "build", "check", "emit", "new", "info", "clean",
        "if", "then", "else", "elif", "fi", "for", "while", "do", "done", "in", "export", "alias"
      ]);

      return source.split("\n").map(line => {
        if (!line.trim()) return "";
        const commentIndex = line.indexOf("#");
        const body = commentIndex >= 0 ? line.slice(0, commentIndex) : line;
        const comment = commentIndex >= 0 ? line.slice(commentIndex) : "";
        
        const highlighted = body.replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|--?[A-Za-z0-9_-]+|\b[A-Za-z0-9_\.\/-]+\b|\$\w+|\d+)/g, (token, _, offset) => {
          let kind = "";
          if (token.startsWith('"') || token.startsWith("'")) {
            kind = "string";
          } else if (token.startsWith("-")) {
            kind = "flag";
          } else if (token.startsWith("$")) {
            kind = "variable";
          } else if (/^\d+$/.test(token)) {
            kind = "number";
          } else if (shellKeywords.has(token)) {
            kind = "command";
          } else {
            const prefix = body.slice(0, offset).trim();
            if (prefix === "" || prefix === "crumbs" || prefix === "cookie") {
              kind = "command";
            }
          }
          return kind ? `<span class="tok-${kind}">${escapeHTML(token)}</span>` : escapeHTML(token);
        });

        return highlighted + (comment ? `<span class="tok-comment">${escapeHTML(comment)}</span>` : "");
      }).join("\n");
    }

    function renderCode(source, language, highlighter) {
      const wrapper = make("div", "code-wrap");
      const top = make("div", "code-top");
      const topLeft = make("div", "code-top-left");
      const dots = make("span", "code-dots");
      dots.innerHTML = "<i></i><i></i><i></i>";
      topLeft.append(dots, make("span", "", language));
      const copy = make("button", "copy-button", "Copy");
      copy.type = "button";
      copy.setAttribute("aria-label", "Copy code");
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(source);
          copy.textContent = "Copied";
          window.setTimeout(() => { copy.textContent = "Copy"; }, 1300);
        } catch {
          copy.textContent = "Unavailable";
        }
      });
      top.append(topLeft, copy);
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.innerHTML = highlighter(source);
      pre.append(code);
      wrapper.append(top, pre);
      return wrapper;
    }

    /* ------------------------------------------------------------------ routing */
    // Hash forms:  ""  overview | "<subsection>"  a guide page | "std"  library index | "std/<module>"  a module page
    // Any of them may end in "@<anchor>" to jump to a feature or an API item inside the page.
    const LAST = { guide: "", std: "std" };
    const featureAnchor = (subId, feature, i) => `f-${subId}-${feature.id || i}`;

    function openHash(hash, push = true) {
      if (push) history.pushState({}, "", window.location.pathname + (hash ? `#${hash}` : ""));
      route(hash);
    }
    function currentHash() { return decodeURIComponent(location.hash.replace(/^#/, "")); }

    function route(hash) {
      const [path, anchor = ""] = hash.split("@");
      const mode = path === "std" || path.startsWith("std/") ? "std" : "guide";
      if (mode !== MODE) setMode(mode, false);
      LAST[mode] = hash;
      CURRENT_PAGE_ID = path || "overview";
      CURRENT_ANCHOR = anchor;

      const app = $("app-content");
      app.innerHTML = "";
      const container = make("div", "page-view");
      if (mode === "std") {
        const id = path.slice(4);
        if (id && STD_MODULES.has(id)) renderStdModule(container, STD_MODULES.get(id));
        else renderStdIndex(container);
      } else if (path && SUBSECTION_MAP.has(path)) {
        renderSubsectionPage(container, SUBSECTION_MAP.get(path));
      } else {
        CURRENT_PAGE_ID = "overview";
        renderOverviewPage(container);
      }
      app.append(container);
      document.title = pageTitle(mode, path) + " — Crumbs documentation";
      renderNav();
      if (anchor && $(anchor)) {
        const el = $(anchor);
        requestAnimationFrame(() => {
          el.scrollIntoView({ block: "start", behavior: "auto" });
          el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
        });
      } else {
        window.scrollTo({ top: 0, behavior: "auto" });
      }
    }

    function pageTitle(mode, path) {
      if (mode === "std") return path.length > 4 && STD_MODULES.has(path.slice(4)) ? `std.${path.slice(4)}` : "Standard library";
      return SUBSECTION_MAP.has(path) ? SUBSECTION_MAP.get(path).subsection.title : "Overview";
    }

    function setMode(mode, navigate = true) {
      MODE = mode;
      document.querySelectorAll(".mode-tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === mode)));
      $("doc-search").placeholder = mode === "std" ? "Search functions, types, modules..." : "Search the guide...";
      $("nav-title").textContent = mode === "std" ? "Reference" : "Contents";
      if (navigate) openHash(LAST[mode] || (mode === "std" ? "std" : ""));
      else renderNav();
    }

    /* ------------------------------------------------------------------ standard library pages */
    const paragraphs = text => String(text || "").split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
    const stdId = (...parts) => "a-" + parts.join("-");

    function proseBlock(text) {
      const box = make("div", "api-prose");
      paragraphs(text).forEach(p => { const el = make("p"); el.innerHTML = inlineText(p); box.append(el); });
      return box;
    }

    function signature(f) {
      const tp = f.tparams && f.tparams.length ? `<${f.tparams.join(", ")}>` : "";
      const ps = [];
      if (f.receiver) ps.push(f.receiver);
      (f.params || []).forEach(p => ps.push(`${p.name}: ${p.type}` + (p.default ? ` = ${p.default}` : "")));
      const ret = f.returns ? ` -> ${f.returns}` : "";
      const one = `fn ${f.name}${tp}(${ps.join(", ")})${ret}`;
      if (one.length <= 74 || ps.length < 2) return one;
      return `fn ${f.name}${tp}(\n${ps.map(p => "    " + p).join(",\n")}\n)${ret}`;
    }

    function crumbsCrumbs(parts) {            // breadcrumbs: [[label, hash|null], ...]
      const el = make("div", "breadcrumbs");
      parts.forEach(([label, hash], i) => {
        if (i) el.append(make("span", "", "/"));
        if (hash === null) el.append(make("span", i === parts.length - 1 ? "current" : "", label));
        else { const a = make("a", "", label); a.addEventListener("click", () => openHash(hash)); el.append(a); }
      });
      return el;
    }

    function apiTable(caption, headers, rows, classes) {
      const t = make("table", "api-table");
      t.append(make("caption", "", caption));
      const head = make("thead"); const hr = make("tr");
      headers.forEach(h => hr.append(make("th", "", h)));
      head.append(hr); t.append(head);
      const body = make("tbody");
      rows.forEach(cells => {
        const tr = make("tr");
        cells.forEach((c, i) => {
          const td = make("td", classes[i] || "");
          if (classes[i] === "d") td.innerHTML = inlineText(c);
          else td.textContent = c;
          tr.append(td);
        });
        body.append(tr);
      });
      t.append(body);
      return t;
    }

    function fnCard(f, id, owner, kindLabel) {
      const card = make("article", "api-fn");
      card.id = id;
      const head = make("div", "api-fn-head");
      const name = make("h4", "api-fn-name");
      if (owner) name.append(make("span", "owner", owner + "."));
      name.append(document.createTextNode(f.name));
      head.append(name);
      if (owner && !f.receiver) head.append(make("span", "badge", "static"));
      if (f.receiver === "mut self") { const b = make("span", "badge mut", "needs let mut"); b.title = "Call it on a variable declared with `let mut`"; head.append(b); }
      if (f.fallible) { const b = make("span", "badge fail", "can fail"); b.title = "Returns an error union: use `try` or `catch`"; head.append(b); }
      if (kindLabel) head.append(make("span", "badge", kindLabel));
      card.append(head);
      const sig = make("pre", "api-sig");
      sig.innerHTML = highlightCrumbs(signature(f));
      card.append(sig);
      if (f.doc) { const d = make("p", "api-desc"); d.innerHTML = inlineText(f.doc.replace(/\s*\n\s*/g, " ")); card.append(d); }
      if (f.params && f.params.length) {
        card.append(apiTable("Parameters", ["Name", "Type", "Description"],
          f.params.map(p => [p.name, p.type, (p.doc || "") + (p.default ? ` (default ${"`" + p.default + "`"})` : "")]), ["", "ty", "d"]));
      }
      const ret = f.returns ? f.returns : "";
      const rdoc = f.returns_doc || "";
      if (ret || rdoc) {
        const r = make("div", "api-returns");
        r.append(make("b", "", "Returns"));
        const span = make("span");
        span.innerHTML = rdoc ? inlineText(rdoc) : `<code class="inline-code">${escapeHTML(ret)}</code>`;
        r.append(span);
        card.append(r);
      } else {
        const r = make("div", "api-returns"); r.append(make("b", "", "Returns")); r.append(document.createTextNode("nothing")); card.append(r);
      }
      return card;
    }

    function renderStdIndex(container) {
      container.append(crumbsCrumbs([["Crumbs", ""], ["Standard library", null]]));
      const header = make("div", "subsection-page-header");
      header.append(make("div", "subsection-page-category", "Reference"));
      header.append(make("h1", "subsection-page-title", "Standard library"));
      container.append(header);
      const lead = make("p", "api-lead");
      lead.innerHTML = "Every function, type and error in the standard library, with its parameters, what it returns and what it does. Import a module with <code class=\"inline-code\">import std.name;</code> and use it as <code class=\"inline-code\">name.function(...)</code>. Names in the <b>prelude</b> need no import.";
      container.append(lead);
      STD_DATA.groups.forEach(g => {
        container.append(make("div", "std-group-title", g.title));
        const grid = make("div", "std-grid");
        g.modules.forEach(id => {
          const m = STD_MODULES.get(id);
          const card = make("a", "std-card");
          card.append(make("b", "", m.id === "prelude" ? "prelude" : `std.${m.id}`));
          card.append(make("span", "", m.summary ? m.summary.charAt(0).toUpperCase() + m.summary.slice(1) : ""));
          card.append(make("small", "", countLine(m)));
          card.addEventListener("click", () => openHash(`std/${m.id}`));
          grid.append(card);
        });
        container.append(grid);
      });
      appendFooter(container);
    }

    function countLine(m) {
      const fns = m.functions.length + m.types.reduce((n, t) => n + t.methods.filter(x => !x.via || x.doc).length, 0);
      const bits = [];
      if (m.types.length) bits.push(`${m.types.length} type${m.types.length > 1 ? "s" : ""}`);
      bits.push(`${fns} function${fns === 1 ? "" : "s"}`);
      return bits.join(" · ");
    }

    function renderStdModule(container, m) {
      const group = STD_DATA.groups.find(g => g.modules.includes(m.id));
      container.append(crumbsCrumbs([["Crumbs", ""], ["Standard library", "std"], [group ? group.title : "", null], [m.id === "prelude" ? "prelude" : `std.${m.id}`, null]].filter(x => x[0])));
      const header = make("div", "subsection-page-header");
      header.append(make("div", "subsection-page-category", group ? group.title : "Standard library"));
      header.append(make("h1", "subsection-page-title", m.id === "prelude" ? "Prelude" : `std.${m.id}`));
      container.append(header);
      if (m.summary) { const lead = make("p", "api-lead"); lead.innerHTML = inlineText(m.summary.replace(/\.$/, "").replace(/^./, c => c.toUpperCase()) + "."); container.append(lead); }
      if (m.id !== "prelude") {
        const imp = make("div", "api-import");
        imp.innerHTML = `<span><span class="tok-keyword">import</span> ${escapeHTML(m.import)};</span>`;
        const copy = make("button", "", "Copy"); copy.type = "button";
        copy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(`import ${m.import};`); copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); } catch {} });
        imp.append(copy);
        container.append(imp);
      }
      if (m.description) container.append(proseBlock(m.description));

      // quick links
      const toc = make("nav", "api-toc");
      toc.setAttribute("aria-label", "In this module");
      const addToc = (label, id) => { const a = make("a", "", label); a.addEventListener("click", () => openHash(`std/${m.id}@${id}`)); toc.append(a); };
      m.types.filter(t => !t.ext || t.methods.length).forEach(t => addToc(t.name, stdId(m.id, "type", t.name)));
      m.traits.forEach(t => addToc(t.name, stdId(m.id, "trait", t.name)));
      m.functions.forEach(f => addToc(f.name, stdId(m.id, "fn", f.name)));
      if (toc.childNodes.length) container.append(toc);

      if (m.example) {
        container.append(make("h2", "api-h2", "Example"));
        container.append(renderCode(m.example, "crumbs", highlightCrumbs));
      }

      if (m.types.length) {
        const h = make("h2", "api-h2", "Types"); h.append(make("small", "", String(m.types.length))); container.append(h);
        m.types.forEach(t => {
          const box = make("section", "api-type");
          box.id = stdId(m.id, "type", t.name);
          const head = make("div", "api-type-head");
          const tp = t.tparams && t.tparams.length ? `<${t.tparams.join(", ")}>` : "";
          head.append(make("span", "kw", t.kind === "builtin" ? "methods on" : t.kind), make("h3", "", t.name + tp));
          box.append(head);
          if (t.doc) box.append(proseBlock(t.doc));
          if (t.show_fields && t.fields.length) {
            box.append(apiTable("Fields", ["Name", "Type", "Description"], t.fields.map(f => [f.name, f.type || "", f.doc || ""]), ["", "ty", "d"]));
          }
          const methods = t.methods.filter(x => !x.via || x.doc);
          if (methods.length) {
            const list = make("div", "api-methods");
            methods.forEach(f => list.append(fnCard(f, stdId(m.id, t.name, f.name), t.name, "")));
            box.append(list);
          }
          container.append(box);
        });
      }

      if (m.traits.length) {
        const h = make("h2", "api-h2", "Traits"); container.append(h);
        m.traits.forEach(t => {
          const box = make("section", "api-type");
          box.id = stdId(m.id, "trait", t.name);
          const head = make("div", "api-type-head");
          head.append(make("span", "kw", "trait"), make("h3", "", t.name));
          box.append(head);
          if (t.doc) box.append(proseBlock(t.doc));
          if (t.methods.length) {
            const list = make("div", "api-methods");
            t.methods.forEach(f => list.append(fnCard(f, stdId(m.id, t.name, f.name), t.name, "required")));
            box.append(list);
          }
          container.append(box);
        });
      }

      if (m.functions.length) {
        const h = make("h2", "api-h2", "Functions"); h.append(make("small", "", String(m.functions.length))); container.append(h);
        m.functions.forEach(f => container.append(fnCard(f, stdId(m.id, "fn", f.name), "", "")));
      }

      if (m.consts.length) {
        container.append(make("h2", "api-h2", "Constants"));
        const t = apiTable("", ["Name", "Type", "Description"], m.consts.map(c => [c.name, c.type, (c.doc || "") + (c.value ? ` (= \`${c.value}\`)` : "")]), ["", "ty", "d"]);
        m.consts.forEach((c, i) => { t.tBodies[0].rows[i].id = stdId(m.id, "const", c.name); });
        container.append(t);
      }

      if (m.errors.length) {
        const h = make("h2", "api-h2", "Errors"); container.append(h);
        const t = apiTable("", ["Error", "Meaning"], m.errors.map(e => [`${m.id}.${e.name}`, e.doc || ""]), ["", "d"]);
        m.errors.forEach((e, i) => { t.tBodies[0].rows[i].id = stdId(m.id, "error", e.name); });
        container.append(t);
        const note = make("p", "api-desc"); note.style.marginTop = "10px";
        note.innerHTML = inlineText("Functions marked **can fail** return an error union (`T!`). Handle it with `try`, `catch` or `.catch(|e| ...)`.".replace(/\*\*(.+?)\*\*/g, "$1"));
        container.append(note);
      }
      appendFooter(container);
    }

    /* ------------------------------------------------------------------ benchmarks (overview page) */
    function renderBenchmarks(container) {
      const data = BENCH_DATA;
      if (!data || !data.programs.length) return;
      const sec = make("section", "bench");
      sec.id = "performance";
      const head = make("div", "quickstart-heading");
      head.append(make("h2", "", "Performance"), make("span", "", "Crumbs against other languages"));
      sec.append(head);
      const lead = make("p", "bench-lead");
      lead.textContent = `Run time of the same program in each language, relative to C (1.0x = as fast as C; lower is better). Best of ${data.runs} runs on ${data.machine}. Every language printed the same answer. The first Crumbs column is the default build (owned memory, no garbage collector); the ${"`--gc`"} column is the same programs built with the optional collector.`.replace(/`/g, "");
      sec.append(lead);

      const langs = data.languages;
      const baseId = langs.some(l => l.id === "c") ? "c" : "cpp";
      const wrap = make("div", "bench-scroll");
      const table = make("table", "bench-table");
      const thead = make("thead"); const hr = make("tr");
      hr.append(make("th", "", "Program"));
      langs.forEach(l => hr.append(make("th", l.id.startsWith("crumbs") ? "me" : "", l.label)));
      thead.append(hr); table.append(thead);
      const body = make("tbody");
      const ratios = {};
      data.programs.forEach(p => {
        const base = (p.results[baseId] || p.results.cpp || p.results.crumbs).seconds;
        const tr = make("tr");
        tr.append(make("td", "", p.title.replace(/:.*$/, "").replace(/, /, " · ")));
        const fastest = Math.min(...Object.values(p.results).filter(r => r.ok).map(r => r.seconds));
        langs.forEach(l => {
          const r = p.results[l.id];
          const td = make("td", l.id.startsWith("crumbs") ? "me" : "");
          if (!r) { td.textContent = "–"; td.title = "no version of this program"; }
          else {
            const rel = r.seconds / base;
            (ratios[p.id] = ratios[p.id] || {})[l.id] = rel;
            const cell = make("span", "bench-cell", rel >= 10 ? `${rel.toFixed(0)}x` : `${rel.toFixed(2)}x`);
            const bar = make("i"); bar.style.width = `${Math.min(100, rel / 4 * 100)}%`;
            cell.append(bar);
            td.append(cell);
            td.title = `${r.seconds.toFixed(2)} s · peak ${r.rss_mib} MiB`;
            if (!r.ok) { td.classList.add("bad"); td.title += " · OUTPUT DIFFERS"; }
            if (r.ok && r.seconds === fastest) td.classList.add("best");
          }
          tr.append(td);
        });
        body.append(tr);
      });
      table.append(body); wrap.append(table); sec.append(wrap);
      const note = make("p", "bench-note");
      note.textContent = "Hover a cell for the time in seconds and the peak memory. The fastest result of each row is highlighted. Bounds checks are on for Crumbs, Rust, Go and Java; the \"unchecked\" column removes them from Crumbs. The hash-map row is relative to C++ (there is no C hash map in the standard library).";
      sec.append(note);

      // owned memory (default) vs. the optional collector
      const cards = make("div", "bench-gc");
      const pair = data.programs.filter(p => p.results.crumbs && p.results["crumbs-gc"]);
      if (pair.length) {
        const ratio = p => p.results["crumbs-gc"].seconds / p.results.crumbs.seconds;
        const geo = pair.reduce((a, p) => a + Math.log(ratio(p)), 0) / pair.length;
        const worst = pair.reduce((a, p) => (ratio(p) > a.r ? { p, r: ratio(p) } : a), { r: 0 });
        const card = (big, small) => { const d = make("div"); d.append(make("b", "", big), make("span", "", small)); cards.append(d); };
        card(`${Math.exp(geo).toFixed(2)}x`, "typical cost of the optional collector (geometric mean of --gc time ÷ default time)");
        card(`${worst.r.toFixed(1)}x`, `largest cost, on ${worst.p.title.replace(/:.*$/, "")}: ${worst.p.results["crumbs-gc"].seconds.toFixed(2)} s with --gc, ${worst.p.results.crumbs.seconds.toFixed(2)} s by default`);
        const bt = pair.find(p => p.id === "bintrees");
        if (bt) card(`${bt.results.crumbs.rss_mib} MiB`, `peak memory of binary trees by default, against ${bt.results["crumbs-gc"].rss_mib} MiB with --gc`);
        sec.append(cards);
        const gcNote = make("p", "bench-note");
        gcNote.textContent = "By default memory is owned: String, List and std.own values free themselves at scope end and allocation is plain malloc, as cheap as in C (the binary-trees program uses std.own). --gc switches on the conservative collector for programs that want to allocate without thinking about who frees. Programs that never allocate in a loop pay nothing for it either way.";
        sec.append(gcNote);
      }
      container.append(sec);
    }

    function renderOverviewPage(container) {
      const project = DOC_DATA.project || {};
      const repository = project.repository || "https://github.com/H1387Lmao/crumbs";

      // Breadcrumbs
      const crumbs = make("div", "breadcrumbs");
      crumbs.innerHTML = '<span>Crumbs</span><span>/</span><span class="current">Overview</span>';
      container.append(crumbs);

      // Hero Section with crumbs logo displayed inside
      const hero = make("section", "hero");
      const heroHeader = make("div", "hero-header");

      const crumbsText = make("h1", "", project.name || "Crumbs");
      
      const heroText = make("div");
      heroText.append(make("p", "eyebrow", "Language documentation"));
      heroText.append(crumbsText);
      heroText.append(make("p", "hero-tagline", project.tagline || "A small language. Straight to C."));
      heroText.append(make("p", "hero-description", project.description || ""));

      const logoImg = document.createElement("img");
      logoImg.className = "hero-logo";
      logoImg.src = "resources/crumbs-logo.svg";

      heroHeader.append(heroText);
      if (!IS_MOBILE){
        heroHeader.append(logoImg);
      }else{

      });

    function renderSubsectionPage(container, itemData) {
      const { section, subsection } = itemData;

      // Breadcrumbs
      const crumbs = make("div", "breadcrumbs");
      crumbs.innerHTML = `
        <a id="bc-home">Crumbs</a><span>/</span>
        <span>${escapeHTML(section.title)}</span><span>/</span>
        <span class="current">${escapeHTML(subsection.title)}</span>
      `;
      crumbs.querySelector("#bc-home").addEventListener("click", () => openHash(""));
      container.append(crumbs);

      // Subsection Title & Section Eyebrow Header
      const header = make("div", "subsection-page-header");
      header.append(make("div", "subsection-page-category", section.title));
      header.append(make("h1", "subsection-page-title", subsection.title));
      container.append(header);

      // Render Features for this Subsection
      if (section.id === "standard-library") {
        const ref = make("div", "guide-ref-link");
        ref.innerHTML = "<span>Looking for a function? The <b>Standard library reference</b> lists every function with its parameters, return value and description.</span><b>Open reference →</b>";
        ref.addEventListener("click", () => openHash("std"));
        container.append(ref);
      }
      (subsection.features || []).forEach((feature, fi) => {
        const card = make("div", "feature-card");
        card.id = featureAnchor(subsection.id, feature, fi);
        const copy = make("div", "feature-copy");
        copy.append(make("h3", "", feature.title || "Untitled"));
        const desc = make("p", "");
        desc.innerHTML = inlineText(feature.desc || "");
        copy.append(desc);

        if (feature.note) {
          copy.append(make("div", "feature-note", feature.note));
        }
        card.append(copy);

        const example = make("div", "feature-example");
        if (feature.code) example.append(renderCode(feature.code, "crumbs", highlightCrumbs));
        if (feature.command) example.append(renderCode(feature.command, "terminal", highlightShell));

        if (feature.image) {
          const image = document.createElement("img");
          image.className = "feature-image";
          image.src = feature.image;
          image.alt = feature.title || "Documentation example";
          image.loading = "lazy";
          example.append(image);
        }

        if (feature.link) {
          const link = make("a", "feature-link", "Read more →");
          link.href = feature.link;
          link.target = "_blank";
          link.rel = "noreferrer";
          example.append(link);
        }

        if (example.childNodes.length) card.append(example);
        container.append(card);
      });

      // Next Subsection Footer Navigation
      const currentIndex = SUBSECTION_ORDER.indexOf(subsection.id);
      if (currentIndex >= 0 && currentIndex < SUBSECTION_ORDER.length - 1) {
        const nextId = SUBSECTION_ORDER[currentIndex + 1];
        const nextData = SUBSECTION_MAP.get(nextId);
        
        if (nextData) {
          const navFooter = make("div", "subsection-nav-footer");
          const nextBtn = make("button", "next-subsection-btn");
          nextBtn.type = "button";
          
          const btnText = make("div", "next-btn-text");
          btnText.append(make("span", "next-label", `Next in ${nextData.section.title}`));
          btnText.append(make("span", "next-title", nextData.subsection.title));
          
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          icon.setAttribute("viewBox", "0 0 24 24");
          icon.innerHTML = '<path d="M5 12h14M12 5l7 7-7 7"/>';

          nextBtn.append(btnText, icon);
          nextBtn.addEventListener("click", () => openHash(nextId));
          navFooter.append(nextBtn);
          container.append(navFooter);
        }
      }

      appendFooter(container);
    }

    function appendFooter(container) {
      const repository = DOC_DATA.project?.repository || "https://github.com/H1387Lmao/crumbs";
      const footer = make("footer", "footer");
      footer.append(make("span", "", "Crumbs language documentation"));
      const repo = make("a", "", "Source repository ↗");
      repo.href = repository;
      repo.target = "_blank";
      repo.rel = "noreferrer";
      footer.append(repo);
      container.append(footer);
    }

    function setupTheme() {
      const button = $("theme-toggle");
      const icon = $("theme-icon");
      function paint() {
        const dark = document.documentElement.dataset.theme !== "light";
        icon.innerHTML = dark
          ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
          : '<path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/>';
        button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        button.title = dark ? "Switch to light theme" : "Switch to dark theme";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#191a17" : "#f0f0eb";
      }
      paint();
      button.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("crumbs-theme", next); } catch {}
        paint();
      });
    }

    /* ------------------------------------------------------------------ navigation model */
    function buildNavModels() {
      // Guide: section -> subsection (page) -> feature (anchor)
      const guide = [{ title: null, pages: [{ id: "", hash: "", title: "Overview", text: "overview home start", items: [] }] }];
      (DOC_DATA.sections || []).forEach(section => {
        guide.push({
          title: section.title,
          pages: (section.subsections || []).map(sub => ({
            id: sub.id, hash: sub.id, title: sub.title || "Untitled", text: `${section.title} ${sub.title}`.toLowerCase(),
            items: (sub.features || []).map((f, i) => {
              const a = featureAnchor(sub.id, f, i);
              return { id: a, hash: `${sub.id}@${a}`, title: f.title || "Untitled", kind: "", mono: false,
                       text: `${f.title} ${f.desc || ""} ${f.code || ""} ${f.command || ""}`.toLowerCase() };
            })
          }))
        });
      });
      NAV.guide = guide;

      if (!STD_DATA) { NAV.std = []; return; }
      const std = [{ title: null, pages: [{ id: "std", hash: "std", title: "All modules", text: "standard library reference index", items: [] }] }];
      STD_DATA.groups.forEach(g => {
        std.push({
          title: g.title,
          pages: g.modules.map(id => {
            const m = STD_MODULES.get(id);
            const items = [];
            const add = (kind, name, anchor, blob, shown) => items.push({ id: anchor, hash: `std/${m.id}@${anchor}`, title: shown || name, name: name.toLowerCase(), kind, mono: true, text: `${shown || name} ${blob}`.toLowerCase() });
            m.types.forEach(t => {
              if (t.ext && !t.methods.length) return;
              add("T", t.name, stdId(m.id, "type", t.name), `${t.doc} type ${t.kind}`);
              t.methods.filter(x => !x.via || x.doc).forEach(f => add("m", f.name, stdId(m.id, t.name, f.name), `${signature(f)} ${f.doc || ""} ${(f.params || []).map(p => p.doc || "").join(" ")} ${f.returns_doc || ""}`, `${t.name}.${f.name}`));
            });
            m.traits.forEach(t => add("T", t.name, stdId(m.id, "trait", t.name), `${t.doc} trait`));
            m.functions.forEach(f => add("f", f.name, stdId(m.id, "fn", f.name), `${signature(f)} ${f.doc || ""} ${(f.params || []).map(p => p.doc || "").join(" ")} ${f.returns_doc || ""}`));
            m.consts.forEach(c => add("c", c.name, stdId(m.id, "const", c.name), `${c.doc || ""} constant`));
            m.errors.forEach(e => add("!", e.name, stdId(m.id, "error", e.name), `${e.doc || ""} error`, `${m.id}.${e.name}`));
            const label = m.id === "prelude" ? "prelude" : m.id;
            return { id: `std/${m.id}`, hash: `std/${m.id}`, title: label, mono: true, name: m.id,
                     text: `${label} std.${m.id} ${m.summary || ""} ${m.description || ""}`.toLowerCase(), items };
          })
        });
      });
      NAV.std = std;
    }

    /* ------------------------------------------------------------------ search + nav rendering */
    const escapeRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    function markText(text, terms) {
      if (!terms.length) return escapeHTML(text);
      const re = new RegExp("(" + terms.map(escapeRe).join("|") + ")", "gi");
      return text.split(re).map((part, i) => i % 2 ? `<mark>${escapeHTML(part)}</mark>` : escapeHTML(part)).join("");
    }
    // 0 = no match; every term must occur. Names count for more than descriptions.
    function score(target, terms, nameKey) {
      const name = (target[nameKey] || target.title || "").toLowerCase();
      const blob = target.text;
      let total = 0;
      for (const t of terms) {
        if (name === t) total += 10;
        else if (name.startsWith(t)) total += 6;
        else if (name.includes(t)) total += 4;
        else if (blob.includes(t)) total += 1;
        else return 0;
      }
      return total;
    }
    function searchModel(mode, terms) {
      const out = [];
      NAV[mode].forEach(section => {
        const pages = [];
        section.pages.forEach(page => {
          const own = score(page, terms, "name");
          const hits = page.items.map(it => ({ it, s: score(it, terms, "name") })).filter(x => x.s > 0)
            .sort((a, b) => b.s - a.s).map(x => x.it);
          if (own || hits.length) pages.push({ page, own, hits });
        });
        if (pages.length) {
          pages.sort((a, b) => b.own - a.own);                 // pages whose own name matches come first
          out.push({ title: section.title, pages, best: pages[0].own });
        }
      });
      out.sort((a, b) => b.best - a.best);
      return out;
    }

    const EXPANDED = new Set();
    const HIT_LIMIT = 10;
    const KIND_TITLES = { T: "type", f: "function", m: "method", c: "constant", "!": "error" };

    function renderNav() {
      const nav = $("navigation");
      const query = $("doc-search").value.trim().toLowerCase();
      const terms = query.split(/\s+/).filter(Boolean);
      $("search-wrap").classList.toggle("has-text", !!query);
      nav.innerHTML = "";
      let model, pageCount = 0, itemCount = 0;
      if (terms.length) model = searchModel(MODE, terms);
      else model = NAV[MODE].map(sec => ({ title: sec.title, pages: sec.pages.map(page => ({ page, own: 1, hits: [] })) }));

      model.forEach(sec => {
        const wrap = make("div", "nav-section");
        if (sec.title) wrap.append(make("div", "nav-group-label", sec.title));
        sec.pages.forEach(({ page, hits }) => {
          pageCount++;
          const isActive = page.hash.split("@")[0] === (CURRENT_PAGE_ID === "overview" ? "" : CURRENT_PAGE_ID);
          const holder = make("div", "nav-page");
          const link = make("a", "nav-page-link" + (isActive ? " active" : ""));
          link.href = "#" + page.hash.split("@")[0];
          const label = make("span", page.mono ? "mono" : "");
          label.innerHTML = markText(page.title, terms);
          link.append(label);
          if (!terms.length && page.items.length && MODE === "std") link.append(make("span", "tag", String(page.items.length)));
          link.addEventListener("click", e => { e.preventDefault(); openHash(page.hash.split("@")[0]); closeMenu(); });
          holder.append(link);

          // anchors: every item of the open page, or the matches while searching
          let list = [];
          if (terms.length) list = hits;
          else if (isActive) list = page.items;
          if (list.length) {
            itemCount += terms.length ? list.length : 0;
            const key = page.hash + "|" + query;
            const showAll = EXPANDED.has(key) || !terms.length || list.length <= HIT_LIMIT + 2;
            const shown = showAll ? list : list.slice(0, HIT_LIMIT);
            const box = make("div", "nav-anchors" + (terms.length ? " nav-page-hits" : ""));
            shown.forEach(it => {
              const a = make("a", "nav-anchor");
              a.href = "#" + it.hash;
              if (it.kind) { const k = make("span", "kind", it.kind); k.title = KIND_TITLES[it.kind] || ""; a.append(k); }
              const t = make("span", it.mono ? "mono" : "");
              t.innerHTML = markText(it.title, terms);
              a.append(t);
              a.addEventListener("click", e => { e.preventDefault(); openHash(it.hash); closeMenu(); });
              box.append(a);
            });
            if (!showAll) {
              const more = make("button", "nav-more", `Show ${list.length - HIT_LIMIT} more`);
              more.type = "button";
              more.addEventListener("click", () => { EXPANDED.add(key); renderNav(); });
              box.append(more);
            }
            holder.append(box);
          }
          wrap.append(holder);
        });
        nav.append(wrap);
      });

      $("nav-empty").style.display = pageCount ? "none" : "block";
      $("nav-empty").textContent = terms.length ? `Nothing matches "${$("doc-search").value.trim()}".` : "No topics.";
      $("topic-count").textContent = terms.length ? `${itemCount} match${itemCount === 1 ? "" : "es"}`
        : MODE === "std" ? `${STD_MODULES.size} modules` : `${SUBSECTION_ORDER.length} topics`;

      // a hint when the other half of the docs has results
      const cross = $("nav-cross");
      cross.innerHTML = "";
      if (terms.length) {
        const other = MODE === "guide" ? "std" : "guide";
        const found = searchModel(other, terms);
        const n = found.reduce((a, s) => a + s.pages.reduce((b, p) => b + Math.max(p.hits.length, 1), 0), 0);
        if (n) {
          const b = make("button", "nav-cross", `${n} result${n === 1 ? "" : "s"} for "${$("doc-search").value.trim()}" in ${other === "std" ? "the Standard library" : "the Guide"} →`);
          b.type = "button";
          b.addEventListener("click", () => setMode(other, true));
          cross.append(b);
        }
      }
      scrollActiveIntoView();
    }

    function scrollActiveIntoView() {
      if ($("doc-search").value.trim()) return;
      const el = document.querySelector(".nav-page-link.active");
      if (!el) return;
      const box = $("sidebar-scroll");
      const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (r.top < b.top + 8 || r.bottom > b.bottom - 8) box.scrollTop += r.top - b.top - 80;
    }

    function setupSearch() {
      const input = $("doc-search");
      let timer = 0;
      input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(renderNav, 60); });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const first = document.querySelector(".nav-anchor") || document.querySelector(".nav-page-link");
          if (first) first.click();
        } else if (e.key === "Escape") {
          if (input.value) { input.value = ""; renderNav(); } else input.blur();
        }
      });
      $("search-clear").addEventListener("click", () => { input.value = ""; renderNav(); input.focus(); });
    }

    /* ------------------------------------------------------------------ mobile menu */
    function setMenu(open) {
      $("sidebar").classList.toggle("open", open);
      $("sidebar-backdrop").classList.toggle("open", open);
      document.body.classList.toggle("menu-open", open);
      $("menu-toggle").setAttribute("aria-expanded", String(open));
    }
    function closeMenu() { if ($("sidebar").classList.contains("open")) setMenu(false); }

    function setupMenu() {
      $("menu-toggle").addEventListener("click", () => setMenu(!$("sidebar").classList.contains("open")));
      $("sidebar-backdrop").addEventListener("click", () => setMenu(false));
      document.addEventListener("keydown", event => {
        const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
        if (event.key === "Escape") closeMenu();
        if (event.key === "/" && !typing) {
          event.preventDefault();
          if (window.innerWidth <= 820) setMenu(true);
          $("doc-search").focus();
        }
      });
      window.addEventListener("resize", () => { if (window.innerWidth > 820) closeMenu(); });
    }

    /* ------------------------------------------------------------------ start */
    $("brand-home").addEventListener("click", () => { setMode("guide", false); openHash(""); });
    document.querySelectorAll(".mode-tab").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.mode !== MODE) setMode(b.dataset.mode, true);
    }));
    window.addEventListener("popstate", () => route(currentHash()));

    setupTheme();
    setupMenu();
    setupSearch();

    const fetchJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(`Could not load ${url}`); return r.json(); });
    Promise.all([
      fetchJSON(DATA_URL),
      fetchJSON(STD_URL).catch(error => { console.error(error); return null; }),
      fetchJSON("benchmarks.json").catch(() => null)
    ]).then(([guide, std, bench]) => {
      DOC_DATA = guide;
      STD_DATA = std;
      BENCH_DATA = bench;
      SUBSECTION_MAP.clear(); SUBSECTION_ORDER = [];
      (guide.sections || []).forEach(section => (section.subsections || []).forEach(subsection => {
        SUBSECTION_MAP.set(subsection.id, { section, subsection });
        SUBSECTION_ORDER.push(subsection.id);
      }));
      if (std) std.modules.forEach(m => STD_MODULES.set(m.id, m));
      buildNavModels();
      MODE = "";
      const hash = currentHash();
      setMode(hash === "std" || hash.startsWith("std/") ? "std" : "guide", false);
      route(hash);
    }).catch(error => {
      $("app-content").textContent = "The documentation could not be loaded. Check that features.json and stdlib.json are available beside index.html.";
      console.error(error);
    });
  </script>
</body>
</html>
