<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a17">
  <meta name="description" content="Crumbs language documentation: syntax, types, standard library, compiler, and tooling.">
  <title>Crumbs — Documentation</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("crumbs-theme") || "dark";
    } catch {}
  </script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap");

    :root {
      color-scheme: dark;
      --page: #191a17;
      --sidebar: #1e1f1b;
      --surface: #22231f;
      --surface-raised: #292a25;
      --code: #131410;
      --ink: #f0f0e9;
      --muted: #b0b0a5;
      --subtle: #85867c;
      --line: #393a33;
      --line-strong: #4a4b41;
      --accent: #efcf4b;
      --accent-soft: rgba(239, 207, 75, .12);
      --accent-ink: #202019;
      --shadow: 0 18px 52px rgba(0, 0, 0, .32);
      --header-height: 64px;
      --sidebar-width: 264px;
      --content-width: 1080px;
      --ease-out-cubic: cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f7f7f3;
      --sidebar: #f0f0eb;
      --surface: #fff;
      --surface-raised: #f0f0e9;
      --code: #20211d;
      --ink: #272820;
      --muted: #606157;
      --subtle: #85867b;
      --line: #deded5;
      --line-strong: #c9c9bd;
      --accent: #d7b52c;
      --accent-soft: rgba(215, 181, 44, .14);
      --accent-ink: #202019;
      --shadow: 0 18px 52px rgba(30, 31, 24, .13);
    }

    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.7 "DM Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.menu-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { color: inherit; }
    ::selection { background: var(--accent-soft); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Topbar */
    .topbar {
      position: sticky;
      inset: 0 0 auto;
      z-index: 60;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 28px;
      background: color-mix(in srgb, var(--sidebar) 94%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      transition: border-color .3s ease;
    }
    .topbar-left, .topbar-right, .brand, .top-link {
      display: flex;
      align-items: center;
    }
    .topbar-left { gap: 14px; min-width: 0; }
    .brand { gap: 10px; min-width: 0; font-size: 18px; font-weight: 800; letter-spacing: -.055em; cursor: pointer; }
    .brand img {
      display: block; width: 31px; height: 31px; object-fit: contain;
      transition: transform .3s ease;
    }
    .brand:hover img { transform: rotate(-8deg) scale(1.08); }
    .brand-divider { width: 1px; height: 18px; background: var(--line-strong); }
    .brand-context { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0; }
    .topbar-right { gap: 20px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .top-link { transition: color .2s ease; cursor: pointer; }
    .top-link:hover { color: var(--ink); }
    .repo-link { display: inline-flex; align-items: center; gap: 7px; transition: color .2s ease; }
    .repo-link:hover { color: var(--accent); }
    .repo-link svg { width: 16px; height: 16px; fill: currentColor; }
    .icon-button {
      display: grid;
      place-items: center;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      transition: all .2s ease;
    }
    .icon-button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .icon-button svg {
      width: 17px; height: 17px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .menu-toggle { display: none; }

    /* Layout & Sidebar */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: calc(100vh - var(--header-height));
    }
    .sidebar {
      position: sticky;
      top: var(--header-height);
      align-self: start;
      height: calc(100vh - var(--header-height));
      overflow: auto;
      overscroll-behavior: contain;
      padding: 25px 17px 36px 19px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }
    .sidebar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 9px 12px;
      color: var(--subtle);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .sidebar-heading span:last-child {
      color: var(--subtle);
      font: 10px "DM Mono", monospace;
      letter-spacing: 0;
    }
    .search-wrap { position: relative; margin: 0 0 23px; }
    .search-wrap svg {
      position: absolute; top: 11px; left: 11px;
      width: 15px; height: 15px; fill: none;
      stroke: var(--subtle); stroke-width: 1.8;
      transition: stroke .2s ease;
    }
    #doc-search {
      width: 100%;
      height: 39px;
      padding: 0 10px 0 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: 0;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      transition: all .2s ease;
    }
    #doc-search::placeholder { color: var(--subtle); }
    #doc-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #doc-search:focus + svg { stroke: var(--accent); }

    .nav-overview-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: all .2s ease;
    }
    .nav-overview-btn:hover, .nav-overview-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .nav-overview-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    .nav-section { margin: 0 0 11px; }
    .nav-section-head { display: flex; align-items: center; gap: 3px; }
    .nav-section-link {
      flex: 1; min-width: 0; display: block;
      padding: 7px 9px; border-radius: 5px;
      font-size: 12px; font-weight: 750; letter-spacing: -.01em;
      transition: background .15s ease, color .15s ease;
    }
    .nav-section-link:hover, .nav-section.open > .nav-section-head .nav-section-link {
      background: var(--surface-raised);
    }
    .nav-section-count {
      color: var(--subtle);
      font: 10px "DM Mono", monospace;
      margin-left: auto;
      padding-left: 8px;
    }
    .nav-collapse {
      display: grid; place-items: center; flex: 0 0 26px;
      width: 26px; height: 28px; border: 0; border-radius: 4px;
      background: transparent; color: var(--subtle); cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .nav-collapse:hover { background: var(--surface-raised); color: var(--ink); }
    .nav-collapse svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .2s var(--ease-out-cubic); }
    .nav-section:not(.open) .nav-collapse svg { transform: rotate(-90deg); }
    .nav-section-children {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .25s var(--ease-out-cubic), opacity .25s ease;
      opacity: 1;
    }
    .nav-section-children-inner { overflow: hidden; padding: 3px 0 2px 10px; }
    .nav-section:not(.open) .nav-section-children {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }
    .nav-subsection {
      display: block; padding: 5px 8px; margin: 3px 0 3px 6px; border-radius: 4px;
      color: var(--subtle); font-size: 11px; font-weight: 600; line-height: 1.45;
      transition: all .15s ease; cursor: pointer; border-left: 2px solid transparent;
    }
    .nav-subsection:hover { color: var(--ink); background: var(--surface-raised); transform: translateX(2px); }
    .nav-subsection.active { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 700; }
    .nav-empty { display: none; margin: 8px; color: var(--muted); font-size: 12px; }

    /* Main Area & Dynamic Pages */
    .main-area { min-width: 0; }
    main { width: min(100%, var(--content-width)); margin: 0 auto; padding: 42px 48px 88px; }
    .breadcrumbs {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 25px; color: var(--subtle);
      font-size: 11px; font-weight: 650;
    }
    .breadcrumbs a { transition: color .15s ease; cursor: pointer; }
    .breadcrumbs a:hover { color: var(--ink); }
    .breadcrumbs .current { color: var(--accent); }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 12px var(--accent-soft)); }
    }

    .page-view {
      animation: fadeInUp .35s var(--ease-out-cubic) forwards;
    }

    /* Hero / Overview */
    .hero {
      position: relative;
      padding: 0 0 32px;
      margin: 0 0 30px;
      border-bottom: 1px solid var(--line);
    }
    .hero-header {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .hero-logo {
      width: 30vw;
      height: auto;
      object-fit: contain;
      flex-shrink: 0;
      animation: pulseLogo 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.25));
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 0 0 10px; color: var(--accent);
      font-size: 10px; font-weight: 800;
      letter-spacing: .15em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 17px; height: 2px; background: var(--accent); }
    h1 {
      margin: 0; font-size: clamp(43px, 5.2vw, 62px);
      line-height: 1.02; letter-spacing: -.075em; font-weight: 800;
    }
    .hero-tagline {
      margin: 12px 0 0; color: var(--muted);
      font-size: clamp(16px, 2vw, 19px); font-weight: 600;
      letter-spacing: -.035em;
    }
    .hero-description {
      max-width: 680px; margin: 13px 0 0;
      color: var(--muted); font-size: 14px; line-height: 1.85;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 39px; padding: 8px 16px;
      border: 1px solid var(--accent); border-radius: 5px;
      background: var(--accent); color: var(--accent-ink);
      font-size: 11px; font-weight: 800; transition: all .2s ease;
      cursor: pointer;
    }
    .button:hover { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-soft); }
    .button.secondary {
      border-color: var(--line-strong);
      background: transparent; color: var(--ink);
    }
    .button.secondary:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }

    /* Quickstart */
    .quickstart {
      margin: 0 0 45px;
      padding: 20px 21px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      transition: border-color .2s ease;
    }
    .quickstart:hover { border-color: var(--line-strong); }
    .quickstart-heading {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 13px;
    }
    .quickstart-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.035em; }
    .quickstart-heading span { color: var(--subtle); font-size: 10px; font-weight: 650; }
    .quickstart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .quickstart-item {
      min-width: 0; padding: 10px 11px;
      background: var(--surface-raised); border: 1px solid var(--line); border-radius: 5px;
      transition: transform .2s ease, border-color .2s ease;
    }
    .quickstart-item:hover { transform: translateY(-2px); border-color: var(--line-strong); }
    .quickstart-item code {
      display: block; overflow-x: auto; white-space: nowrap;
      color: var(--ink); font: 11px/1.6 "DM Mono", monospace;
    }
    .quickstart-item p { margin: 5px 0 0; color: var(--subtle); font-size: 10px; line-height: 1.5; }

    /* Subsection Single Page View */
    .subsection-page-header {
      padding-bottom: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }
    .subsection-page-category {
      font-size: 11px; font-weight: 750; color: var(--accent);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px;
    }
    .subsection-page-title {
      font-size: 36px; font-weight: 800; letter-spacing: -.05em; margin: 0;
    }

    .feature-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      transition: border-color .2s ease, transform .2s ease;
    }
    .feature-card:hover { border-color: var(--line-strong); }

    .feature-copy { min-width: 0; }
    .feature-copy h3 { margin: 0 0 8px; font-size: 18px; font-weight: 750; letter-spacing: -.02em; line-height: 1.35; }
    .feature-copy p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
    .feature-note {
      margin-top: 14px; padding: 10px 14px;
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
      background: var(--accent-soft); color: var(--ink);
      font-size: 12px; line-height: 1.7;
    }
    .feature-example { margin-top: 18px; min-width: 0; }
    
    /* Code Viewer */
    .code-wrap {
      min-width: 0; overflow: hidden; margin: 0;
      border: 1px solid #36372f; border-radius: 6px;
      background: var(--code); color: #eeeee6;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .code-top {
      height: 34px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 11px;
      border-bottom: 1px solid #34352e; background: #191a16;
      color: #96988d; font: 10px "DM Mono", monospace;
    }
    .code-top-left { display: flex; align-items: center; gap: 8px; }
    .code-dots { display: flex; align-items: center; gap: 4px; }
    .code-dots i { width: 6px; height: 6px; border-radius: 50%; background: #55574d; }
    .copy-button {
      min-height: 26px; padding: 3px 8px;
      border: 1px solid #45473c; border-radius: 4px;
      background: transparent; color: #c4c5b9;
      font: 10px "DM Sans", sans-serif; cursor: pointer;
      transition: all .15s ease;
    }
    .copy-button:hover { border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,0.04); }
    pre {
      max-width: 100%; margin: 0; padding: 14px 16px;
      overflow: auto; color: #e9e9e1;
      font: 12px/1.75 "DM Mono", ui-monospace, monospace;
      tab-size: 4; -webkit-overflow-scrolling: touch;
    }
    code { font-family: "DM Mono", ui-monospace, monospace; }
    .inline-code {
      padding: 2px 5px; border-radius: 4px;
      background: var(--accent-soft); color: var(--accent);
      font-size: .91em; white-space: normal; overflow-wrap: anywhere;
    }

    /* Syntax Highlighting */
    .tok-keyword { color: #e0b0eb; font-weight: 500; }
    .tok-type { color: #8bcbd8; }
    .tok-string { color: #bad58b; }
    .tok-number { color: #edb47c; }
    .tok-comment { color: #85897c; font-style: italic; }
    .tok-function { color: #eed276; }
    .tok-operator { color: #d8a879; }
    .tok-variable { color: #d9b2e9; }
    .tok-flag { color: #8bcbd8; }
    .tok-command { color: #eed276; font-weight: 600; }

    .feature-image {
      display: block; max-width: 100%; height: auto;
      margin-top: 13px; border: 1px solid var(--line);
      border-radius: 5px;
    }
    .feature-link { display: inline-flex; margin-top: 13px; color: var(--accent); font-size: 12px; font-weight: 750; transition: transform .15s ease; }
    .feature-link:hover { text-decoration: underline; transform: translateX(2px); }
    
    /* Next/Previous Sub-Section Footer Link */
    .subsection-nav-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .next-subsection-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      text-align: right;
      transition: all .2s ease;
    }
    .next-subsection-btn:hover {
      border-color: var(--accent);
      background: var(--surface-raised);
      transform: translateX(4px);
    }
    .next-btn-text span { display: block; }
    .next-btn-text .next-label { font-size: 10px; font-weight: 750; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; }
    .next-btn-text .next-title { font-size: 14px; font-weight: 800; color: var(--ink); }
    .next-subsection-btn svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2.5; }

    .no-results {
      display: none; padding: 30px 18px; margin: 20px 0;
      border: 1px dashed var(--line-strong); border-radius: 6px;
      color: var(--muted); text-align: center; font-size: 12px;
    }
    .footer {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 12px; padding-top: 24px; margin-top: 40px; border-top: 1px solid var(--line);
      color: var(--subtle); font-size: 11px;
    }
    .footer a { color: var(--muted); transition: color .15s ease; }
    .footer a:hover { color: var(--accent); }
    .sidebar-backdrop { display: none; }
    [hidden] { display: none !important; }

    @media (max-width: 1080px) {
      :root { --sidebar-width: 242px; }
      main { padding: 35px 32px 75px; }
    }
    @media (max-width: 820px) {
      :root { --header-height: 60px; }
      .topbar { padding: 0 17px; gap: 10px; }
      .topbar-right { gap: 10px; }
      .topbar-right .top-link { display: none; }
      .menu-toggle { display: grid; }
      .brand-context, .brand-divider { display: none; }
      .layout { display: block; min-height: calc(100vh - var(--header-height)); }
      .sidebar {
        position: fixed; z-index: 81;
        top: var(--header-height); bottom: 0; left: 0;
        width: min(88vw, 330px); height: auto;
        padding: 22px 19px 40px;
        border-right: 1px solid var(--line);
        box-shadow: var(--shadow);
        transform: translateX(-105%);
        visibility: hidden;
        transition: transform .25s var(--ease-out-cubic), visibility .25s var(--ease-out-cubic);
      }
      .sidebar.open { transform: translateX(0); visibility: visible; }
      .sidebar-backdrop {
        position: fixed; z-index: 80;
        inset: var(--header-height) 0 0;
        display: block; border: 0;
        background: rgba(0, 0, 0, .48);
        opacity: 0; visibility: hidden;
        transition: opacity .25s ease, visibility .25s ease;
      }
      .sidebar-backdrop.open { opacity: 1; visibility: visible; }
      main { width: min(100%, 780px); padding: 31px 26px 62px; }
    }
    @media (max-width: 600px) {
      .topbar { padding: 0 13px; }
      .brand { gap: 8px; font-size: 17px; }
      .brand img { width: 29px; height: 29px; }
      .repo-link { display: none; }
      .icon-button { width: 38px; height: 38px; flex-basis: 38px; }
      main { padding: 25px 17px 52px; }
      .breadcrumbs { margin-bottom: 19px; }
      .hero { padding-bottom: 25px; margin-bottom: 22px; }
      .hero-header { flex-direction: column-reverse; align-items: flex-start; gap: 12px; }
      .hero-logo { width: 56px; height: 56px; }
      h1 { font-size: clamp(39px, 12vw, 52px); }
      .hero-tagline { font-size: 16px; }
      .hero-description { font-size: 13px; line-height: 1.8; }
      .hero-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .hero-actions .button { width: 100%; padding-inline: 9px; }
      .quickstart { margin-bottom: 43px; padding: 16px; }
      .quickstart-grid { grid-template-columns: 1fr; gap: 7px; }
      .quickstart-item { padding: 9px 10px; }
      .feature-card { padding: 18px; }
      .code-top { height: 33px; }
      pre { padding: 12px; font-size: 11px; line-height: 1.7; }
      .footer { font-size: 10px; }
    }
    @media (max-width: 370px) {
      .topbar { padding-inline: 10px; }
      .brand { font-size: 16px; }
      main { padding-inline: 13px; }
      .hero-actions { grid-template-columns: 1fr; }
      .quickstart { padding: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .hero-logo { animation: none; }
      .page-view { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-button menu-toggle" id="menu-toggle" type="button"
        aria-label="Open documentation menu" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" id="brand-home" aria-label="Crumbs documentation home">
        <img id="brand-logo" src="resources/crumbs-logo.svg" alt="Crumbs Logo">
        <span>Crumbs</span>
      </a>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-context">Documentation</span>
    </div>
    <nav class="topbar-right" aria-label="Main links">
      <a class="top-link" id="nav-overview-top">Overview</a>
      <a class="repo-link" id="repository-link" href="https://github.com/H1387Lmao/crumbs" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.7-1.49-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.27-2.6 5.21-5.08 5.49.4.35.75 1.02.75 2.06V22c0 .29.2.64.77.53A11.1 11.1 0 0 0 12 .9Z"/></svg>
        Repository
      </a>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch theme">
        <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
    </nav>
  </header>

  <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close documentation menu"></button>

  <div class="layout" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
      <p class="sidebar-heading"><span>Contents</span><span id="topic-count"></span></p>
      
      <button class="nav-overview-btn" id="btn-overview-side" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Overview
      </button>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="doc-search" type="search" placeholder="Search topics..." aria-label="Search the documentation">
      </div>
      <nav id="navigation"></nav>
      <p class="nav-empty" id="nav-empty">No matching topics.</p>
    </aside>

    <div class="main-area">
      <main id="app-content">
        <!-- Rendered dynamically as SPA pages -->
      </main>
    </div>
  </div>

  <script>
    const IS_MOBILE = window.matchMedia("(max-width: 768px)").matches;
    const DATA_URL  = "features.json";
    const KEYWORDS  = new Set([
      "import", "pub", "struct", "enum", "error", "const", "fn", "let", "mut",
      "if", "else", "for", "in", "match", "return", "break", "continue", "try",
      "catch", "throw", "drop", "extern", "include", "link", "define", "export",
      "as", "null", "true", "false", "impl", "region"
    ]);
    const TYPES = new Set([
      "i8", "i16", "i32", "i64", "u8", "u16", "u32", "u64",
      "f32", "f64", "bool", "str", "String", "void", "List"
    ]);
    
    let DOC_DATA = null;
    let SUBSECTION_MAP = new Map();
    let SUBSECTION_ORDER = [];
    let CURRENT_PAGE_ID = "overview";

    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
    const make = (tag, className, text) => {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    };
    const inlineText = value => escapeHTML(value || "").replace(
      /`([^`]+)`/g, '<code class="inline-code">$1</code>'
    );

    function highlightCrumbs(source) {
      const tokenPattern = /(\/\/[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b[A-Za-z_][A-Za-z0-9_]*\b|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b|->|=>|\.\.=|\.\.|\+%=|-%=|\*%=|==|!=|<=|>=|\+%|-%|\*%|&&|\|\||[^\s])/g;
      let output = "";
      let last = 0;
      for (const match of source.matchAll(tokenPattern)) {
        const token = match[0];
        const index = match.index;
        output += escapeHTML(source.slice(last, index));
        let kind = "";
        if (token.startsWith("//")) kind = "comment";
        else if (/^["'`]/.test(token)) kind = "string";
        else if (KEYWORDS.has(token)) kind = "keyword";
        else if (TYPES.has(token)) kind = "type";
        else if (/^\d/.test(token)) kind = "number";
        else if (/^[A-Za-z_]/.test(token) && /^\s*\(/.test(source.slice(index + token.length))) kind = "function";
        else if (/^(->|=>|\.\.|\.\.=|\+%=|-%=|\*%=|==|!=|<=|>=|\+%|-%|\*%|&&|\|\||[+*/%=<>!&|^~-])$/.test(token)) kind = "operator";
        output += kind ? `<span class="tok-${kind}">${escapeHTML(token)}</span>` : escapeHTML(token);
        last = index + token.length;
      }
      return output + escapeHTML(source.slice(last));
    }

    function highlightShell(source) {
      const shellKeywords = new Set([
        "crumbs", "cookie", "run", "build", "check", "emit", "new", "info", "clean",
        "if", "then", "else", "elif", "fi", "for", "while", "do", "done", "in", "export", "alias"
      ]);

      return source.split("\n").map(line => {
        if (!line.trim()) return "";
        const commentIndex = line.indexOf("#");
        const body = commentIndex >= 0 ? line.slice(0, commentIndex) : line;
        const comment = commentIndex >= 0 ? line.slice(commentIndex) : "";
        
        const highlighted = body.replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|--?[A-Za-z0-9_-]+|\b[A-Za-z0-9_\.\/-]+\b|\$\w+|\d+)/g, (token, _, offset) => {
          let kind = "";
          if (token.startsWith('"') || token.startsWith("'")) {
            kind = "string";
          } else if (token.startsWith("-")) {
            kind = "flag";
          } else if (token.startsWith("$")) {
            kind = "variable";
          } else if (/^\d+$/.test(token)) {
            kind = "number";
          } else if (shellKeywords.has(token)) {
            kind = "command";
          } else {
            const prefix = body.slice(0, offset).trim();
            if (prefix === "" || prefix === "crumbs" || prefix === "cookie") {
              kind = "command";
            }
          }
          return kind ? `<span class="tok-${kind}">${escapeHTML(token)}</span>` : escapeHTML(token);
        });

        return highlighted + (comment ? `<span class="tok-comment">${escapeHTML(comment)}</span>` : "");
      }).join("\n");
    }

    function renderCode(source, language, highlighter) {
      const wrapper = make("div", "code-wrap");
      const top = make("div", "code-top");
      const topLeft = make("div", "code-top-left");
      const dots = make("span", "code-dots");
      dots.innerHTML = "<i></i><i></i><i></i>";
      topLeft.append(dots, make("span", "", language));
      const copy = make("button", "copy-button", "Copy");
      copy.type = "button";
      copy.setAttribute("aria-label", "Copy code");
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(source);
          copy.textContent = "Copied";
          window.setTimeout(() => { copy.textContent = "Copy"; }, 1300);
        } catch {
          copy.textContent = "Unavailable";
        }
      });
      top.append(topLeft, copy);
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.innerHTML = highlighter(source);
      pre.append(code);
      wrapper.append(top, pre);
      return wrapper;
    }

    function navigateTo(pageId, pushState = true) {
      CURRENT_PAGE_ID = pageId;
      if (pushState) {
        const hash = pageId === "overview" ? "" : `#${pageId}`;
        history.pushState({ pageId }, "", window.location.pathname + hash);
      }

      // Update Active Navigation State in Sidebar
      document.querySelectorAll(".nav-subsection").forEach(el => {
        el.classList.toggle("active", el.dataset.id === pageId);
      });
      $("btn-overview-side").classList.toggle("active", pageId === "overview");

      const app = $("app-content");
      app.innerHTML = "";
      const container = make("div", "page-view");

      if (pageId === "overview" || !SUBSECTION_MAP.has(pageId)) {
        renderOverviewPage(container);
      } else {
        renderSubsectionPage(container, SUBSECTION_MAP.get(pageId));
      }

      app.append(container);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderOverviewPage(container) {
      const project = DOC_DATA.project || {};
      const repository = project.repository || "https://github.com/H1387Lmao/crumbs";

      // Breadcrumbs
      const crumbs = make("div", "breadcrumbs");
      crumbs.innerHTML = '<span>Crumbs</span><span>/</span><span class="current">Overview</span>';
      container.append(crumbs);

      // Hero Section with crumbs logo displayed inside
      const hero = make("section", "hero");
      const heroHeader = make("div", "hero-header");

      const crumbsText = make("h1", "", project.name || "Crumbs");
      
      const heroText = make("div");
      heroText.append(make("p", "eyebrow", "Language documentation"));
      heroText.append(crumbsText);
      heroText.append(make("p", "hero-tagline", project.tagline || "A small language. Straight to C."));
      heroText.append(make("p", "hero-description", project.description || ""));

      const logoImg = document.createElement("img");
      logoImg.className = "hero-logo";
      logoImg.src = "resources/crumbs-logo.svg";

      heroHeader.append(heroText);
      if (!IS_MOBILE){
        heroHeader.append(logoImg);
      }else{
        crumbsText.append(logoImg);
      }
      hero.append(heroHeader);

      const heroActions = make("div", "hero-actions");
      const getStartedBtn = make("button", "button", "Get started →");
      getStartedBtn.addEventListener("click", () => {
        if (SUBSECTION_ORDER.length > 0) {
          navigateTo(SUBSECTION_ORDER[0]);
        }
      });
      const sourceBtn = make("a", "button secondary", "View source");
      sourceBtn.href = repository;
      sourceBtn.target = "_blank";
      sourceBtn.rel = "noreferrer";

      heroActions.append(getStartedBtn, sourceBtn);
      hero.append(heroActions);
      container.append(hero);

      // Quickstart
      const quickstart = project.quickstart || [];
      if (quickstart.length > 0) {
        const qsSection = make("section", "quickstart");
        qsSection.id = "quick-start";
        const qsHeading = make("div", "quickstart-heading");
        qsHeading.append(make("h2", "", "Quick start"));
        qsHeading.append(make("span", "", "Common compiler commands"));
        qsSection.append(qsHeading);

        const qsGrid = make("div", "quickstart-grid");
        quickstart.forEach(item => {
          const row = make("div", "quickstart-item");
          row.append(make("code", "", item.command || ""));
          if (item.description) row.append(make("p", "", item.description));
          qsGrid.append(row);
        });
        qsSection.append(qsGrid);
        container.append(qsSection);
      }

      appendFooter(container);
    }

    function renderSubsectionPage(container, itemData) {
      const { section, subsection } = itemData;

      // Breadcrumbs
      const crumbs = make("div", "breadcrumbs");
      crumbs.innerHTML = `
        <a id="bc-home">Crumbs</a><span>/</span>
        <span>${escapeHTML(section.title)}</span><span>/</span>
        <span class="current">${escapeHTML(subsection.title)}</span>
      `;
      crumbs.querySelector("#bc-home").addEventListener("click", () => navigateTo("overview"));
      container.append(crumbs);

      // Subsection Title & Section Eyebrow Header
      const header = make("div", "subsection-page-header");
      header.append(make("div", "subsection-page-category", section.title));
      header.append(make("h1", "subsection-page-title", subsection.title));
      container.append(header);

      // Render Features for this Subsection
      (subsection.features || []).forEach(feature => {
        const card = make("div", "feature-card");
        const copy = make("div", "feature-copy");
        copy.append(make("h3", "", feature.title || "Untitled"));
        const desc = make("p", "");
        desc.innerHTML = inlineText(feature.desc || "");
        copy.append(desc);

        if (feature.note) {
          copy.append(make("div", "feature-note", feature.note));
        }
        card.append(copy);

        const example = make("div", "feature-example");
        if (feature.code) example.append(renderCode(feature.code, "crumbs", highlightCrumbs));
        if (feature.command) example.append(renderCode(feature.command, "terminal", highlightShell));

        if (feature.image) {
          const image = document.createElement("img");
          image.className = "feature-image";
          image.src = feature.image;
          image.alt = feature.title || "Documentation example";
          image.loading = "lazy";
          example.append(image);
        }

        if (feature.link) {
          const link = make("a", "feature-link", "Read more →");
          link.href = feature.link;
          link.target = "_blank";
          link.rel = "noreferrer";
          example.append(link);
        }

        if (example.childNodes.length) card.append(example);
        container.append(card);
      });

      // Next Subsection Footer Navigation
      const currentIndex = SUBSECTION_ORDER.indexOf(subsection.id);
      if (currentIndex >= 0 && currentIndex < SUBSECTION_ORDER.length - 1) {
        const nextId = SUBSECTION_ORDER[currentIndex + 1];
        const nextData = SUBSECTION_MAP.get(nextId);
        
        if (nextData) {
          const navFooter = make("div", "subsection-nav-footer");
          const nextBtn = make("button", "next-subsection-btn");
          nextBtn.type = "button";
          
          const btnText = make("div", "next-btn-text");
          btnText.append(make("span", "next-label", `Next in ${nextData.section.title}`));
          btnText.append(make("span", "next-title", nextData.subsection.title));
          
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          icon.setAttribute("viewBox", "0 0 24 24");
          icon.innerHTML = '<path d="M5 12h14M12 5l7 7-7 7"/>';

          nextBtn.append(btnText, icon);
          nextBtn.addEventListener("click", () => navigateTo(nextId));
          navFooter.append(nextBtn);
          container.append(navFooter);
        }
      }

      appendFooter(container);
    }

    function appendFooter(container) {
      const repository = DOC_DATA.project?.repository || "https://github.com/H1387Lmao/crumbs";
      const footer = make("footer", "footer");
      footer.append(make("span", "", "Crumbs language documentation"));
      const repo = make("a", "", "Source repository ↗");
      repo.href = repository;
      repo.target = "_blank";
      repo.rel = "noreferrer";
      footer.append(repo);
      container.append(footer);
    }

    function buildNavigation(data) {
      const navigation = $("navigation");
      navigation.innerHTML = "";
      SUBSECTION_MAP.clear();
      SUBSECTION_ORDER = [];
      let totalSubsections = 0;

      (data.sections || []).forEach(section => {
        const sectionNav = make("div", "nav-section open");
        const sectionHead = make("div", "nav-section-head");
        const sectionLink = make("span", "nav-section-link", section.title);
        
        const count = (section.subsections || []).length;
        totalSubsections += count;
        sectionLink.append(make("span", "nav-section-count", String(count).padStart(2, "0")));
        
        const collapse = make("button", "nav-collapse");
        collapse.type = "button";
        collapse.setAttribute("aria-label", `Collapse ${section.title}`);
        collapse.setAttribute("aria-expanded", "true");
        collapse.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg>';
        collapse.addEventListener("click", (e) => {
          e.stopPropagation();
          const isOpen = sectionNav.classList.toggle("open");
          collapse.setAttribute("aria-expanded", String(isOpen));
        });

        sectionHead.append(sectionLink, collapse);
        
        const children = make("div", "nav-section-children");
        const childrenInner = make("div", "nav-section-children-inner");
        children.append(childrenInner);
        sectionNav.append(sectionHead, children);
        navigation.append(sectionNav);

        (section.subsections || []).forEach(subsection => {
          SUBSECTION_MAP.set(subsection.id, { section, subsection });
          SUBSECTION_ORDER.push(subsection.id);

          const subLink = make("a", "nav-subsection", subsection.title || "Untitled");
          subLink.dataset.id = subsection.id;
          
          const searchTokens = [
            subsection.title,
            ...(subsection.features || []).map(f => `${f.title} ${f.desc} ${f.code} ${f.command}`)
          ].filter(Boolean).join(" ").toLowerCase();
          
          subLink.dataset.search = searchTokens;

          subLink.addEventListener("click", (e) => {
            e.preventDefault();
            navigateTo(subsection.id);
          });

          childrenInner.append(subLink);
        });
      });

      $("topic-count").textContent = `${totalSubsections} topics`;
    }

    function setupTheme() {
      const button = $("theme-toggle");
      const icon = $("theme-icon");
      function paint() {
        const dark = document.documentElement.dataset.theme !== "light";
        icon.innerHTML = dark
          ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
          : '<path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/>';
        button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
        button.title = dark ? "Switch to light theme" : "Switch to dark theme";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#191a17" : "#f0f0eb";
      }
      paint();
      button.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("crumbs-theme", next); } catch {}
        paint();
      });
    }

    function setupSearch() {
      const input = $("doc-search");
      input.addEventListener("input", () => {
        const query = input.value.trim().toLowerCase();
        let visibleCount = 0;

        document.querySelectorAll(".nav-subsection").forEach(link => {
          const visible = !query || link.dataset.search.includes(query);
          link.hidden = !visible;
          if (visible) visibleCount++;
        });

        document.querySelectorAll(".nav-section").forEach(sec => {
          const hasMatch = [...sec.querySelectorAll(".nav-subsection")].some(link => !link.hidden);
          sec.hidden = !!query && !hasMatch;
          if (query && hasMatch) sec.classList.add("open");
        });

        $("nav-empty").style.display = visibleCount ? "none" : "block";
      });
    }

    function setupMenu() {
      const button = $("menu-toggle");
      const sidebar = $("sidebar");
      const backdrop = $("sidebar-backdrop");

      function setOpen(open) {
        sidebar.classList.toggle("open", open);
        backdrop.classList.toggle("open", open);
        document.body.classList.toggle("menu-open", open);
        button.setAttribute("aria-expanded", String(open));
      }

      button.addEventListener("click", () => setOpen(!sidebar.classList.contains("open")));
      backdrop.addEventListener("click", () => setOpen(false));
      sidebar.addEventListener("click", event => {
        if (event.target.closest("a")) setOpen(false);
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") setOpen(false);
        if (event.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
          event.preventDefault();
          if (window.innerWidth <= 820) setOpen(true);
          $("doc-search").focus();
        }
      });
    }

    // Global navigation event handlers
    $("brand-home").addEventListener("click", () => navigateTo("overview"));
    $("btn-overview-side").addEventListener("click", () => navigateTo("overview"));
    $("nav-overview-top").addEventListener("click", () => navigateTo("overview"));

    window.addEventListener("popstate", (e) => {
      const pageId = e.state?.pageId || (location.hash ? location.hash.substring(1) : "overview");
      navigateTo(pageId, false);
    });

    setupTheme();
    setupMenu();
    setupSearch();

    fetch(DATA_URL)
      .then(response => {
        if (!response.ok) throw new Error(`Could not load ${DATA_URL}`);
        return response.json();
      })
      .then(data => {
        DOC_DATA = data;
        buildNavigation(data);
        const initialPage = location.hash ? location.hash.substring(1) : "overview";
        navigateTo(initialPage, false);
      })
      .catch(error => {
        $("app-content").textContent = "The documentation could not be loaded. Check that features.json is available beside index.html.";
        console.error(error);
      });
  </script>
</body>
</html>
